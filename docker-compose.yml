version: '3.8'

services:
  agrovision-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: agrovision-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - model-cache:/app/agrovision/models/weights
      - ./logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - DATABASE_URL=sqlite:///./data/agrovision.db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  agrovision-db:
    image: postgres:15-alpine
    container_name: agrovision-db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: agrovision
      POSTGRES_PASSWORD: agrovision123
      POSTGRES_DB: agrovision
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrovision"]
      interval: 10s
      timeout: 5s
      retries: 5

  agrovision-web:
    image: nginx:alpine
    container_name: agrovision-web
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agrovision-api
    restart: unless-stopped

volumes:
  model-cache:
  postgres-data:

networks:
  default:
    name: agrovision-network