<!--
  AgroVision AI - Detecção em Tempo Real
  Demonstração de Bounding Boxes e Tracking
  ::::::::::::::::::::::::::::::::::::::::::::

  Este SVG demonstra especificamente:
  - Bounding boxes animadas
  - Labels de detecção com confiança
  - Scanning overlaid
  - Informações de tracking
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="bboxSuccess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="bboxWarning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="bboxNew" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="scanLineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </linearGradient>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      <![CDATA[
        /* Animação bounding box - dash */
        @keyframes bboxDashMove {
          to { stroke-dashoffset: -32; }
        }

        /* Animação de pulse para novas detecções */
        @keyframes newDetectionPulse {
          0% { stroke-width: 3; opacity: 1; }
          50% { stroke-width: 5; opacity: 0.7; }
          100% { stroke-width: 3; opacity: 1; }
        }

        /* Scanning line */
        @keyframes scanVertical {
          0% { transform: translateY(0); opacity: 0; }
          10% { opacity: 1; }
          90% { opacity: 1; }
          100% { transform: translateY(600px); opacity: 0; }
        }

        /* Floating label */
        @keyframes labelFloat {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }

        /* Confiança bar */
        @keyframes confidenceGrow {
          from { width: 0; }
        }

        /* Tabela rows highlight */
        @keyframes rowFlash {
          0%, 100% { fill: #1e293b; }
          50% { fill: #2d3f4f; }
        }

        .bbox-detection {
          stroke-dasharray: 8 6;
          animation: bboxDashMove 2s linear infinite;
        }

        .bbox-new {
          animation: newDetectionPulse 1.5s ease-in-out infinite;
        }

        .scan-line {
          animation: scanVertical 4s ease-in-out infinite;
        }

        .detection-label {
          animation: labelFloat 3s ease-in-out infinite;
        }

        .confidence-bar {
          transform-origin: left;
          animation: confidenceGrow 1s ease-out;
        }

        .table-row {
          animation: rowFlash 3s ease-in-out infinite;
        }

        .table-row:nth-child(1) { animation-delay: 0s; }
        .table-row:nth-child(2) { animation-delay: 0.3s; }
        .table-row:nth-child(3) { animation-delay: 0.6s; }
      ]]>
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGradient)"/>

  <!-- Header -->
  <rect width="1600" height="70" fill="#1e293b"/>
  <rect width="1600" height="3" y="70" fill="url(#bboxSuccess)"/>

  <!-- Título -->
  <text x="40" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f1f5f9">
    🔍 Detecção em Tempo Real
  </text>

  <!-- Status Badge -->
  <g transform="translate(1450, 20)">
    <rect width="120" height="36" rx="18" fill="#10b981" opacity="0.2"/>
    <rect width="120" height="36" rx="18" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="20" cy="18" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="23" font-family="Arial" font-size="13" font-weight="bold" fill="#10b981">
      ATIVO
    </text>
  </g>

  <!-- Área de Detecção Principal -->
  <g transform="translate(40, 100)">
    <!-- Background -->
    <rect width="1000" height="650" rx="12" fill="#0f172a"/>
    <rect x="4" y="4" width="992" height="642" rx="8" fill="none" stroke="#334155" stroke-width="2"/>

    <!-- Grid de referência -->
    <g opacity="0.1">
      <defs>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#10b981" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1000" height="650" fill="url(#grid)"/>
    </g>

    <!-- Detecção 1 - Animal Grande -->
    <g transform="translate(200, 250)">
      <!-- Bounding Box -->
      <rect x="0" y="0" width="180" height="220" fill="none" stroke="url(#bboxSuccess)" stroke-width="3" class="bbox-detection" rx="8" filter="url(#strongGlow)"/>

      <!-- Silhueta Animal -->
      <ellipse cx="90" cy="110" rx="75" ry="50" fill="#4a4a4a" opacity="0.5"/>
      <circle cx="145" cy="90" r="25" fill="#4a4a4a" opacity="0.5"/>

      <!-- Label Flutuante -->
      <g class="detection-label" transform="translate(0, -10)">
        <rect x="0" y="-35" width="140" height="30" fill="#10b981" rx="6"/>
        <text x="70" y="-15" font-family="Arial" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">
          ANIMAL #001
        </text>
      </g>

      <!-- Info Box -->
      <rect x="0" y="225" width="180" height="70" fill="#1e293b" rx="8" opacity="0.9"/>
      <text x="15" y="248" font-family="Arial" font-size="11" fill="#94a3b8">Confiança</text>
      <rect x="15" y="258" width="150" height="8" fill="#334155" rx="4"/>
      <rect x="15" y="258" width="139" height="8" fill="url(#bboxSuccess)" rx="4" class="confidence-bar"/>
      <text x="145" y="266" font-family="monospace" font-size="10" fill="#10b981" text-anchor="end">92%</text>

      <text x="15" y="285" font-family="Arial" font-size="11" fill="#94a3b8">Peso: <tspan fill="#f1f5f9" font-weight="bold">185 kg</tspan></text>
      <text x="15" y="300" font-family="Arial" font-size="11" fill="#94a3b8">Status: <tspan fill="#10b981" font-weight="bold">Calmo</tspan></text>

      <!-- Tracking ID -->
      <circle cx="170" cy="10" r="20" fill="#10b981"/>
      <text x="170" y="16" font-family="Arial" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="middle">#1</text>
    </g>

    <!-- Detecção 2 - Animal Médio (NOVA) -->
    <g transform="translate(500, 300)">
      <!-- Bounding Box -->
      <rect x="0" y="0" width="140" height="170" fill="none" stroke="url(#bboxNew)" stroke-width="3" class="bbox-new" rx="6" filter="url(#strongGlow)"/>

      <!-- Silhueta Animal -->
      <ellipse cx="70" cy="85" rx="55" ry="38" fill="#4a4a4a" opacity="0.5"/>
      <circle cx="110" cy="70" r="18" fill="#4a4a4a" opacity="0.5"/>

      <!-- Label Nova Detecção -->
      <g class="detection-label" transform="translate(0, -10)">
        <rect x="0" y="-35" width="140" height="30" fill="#3b82f6" rx="6"/>
        <text x="70" y="-15" font-family="Arial" font-size="12" fill="white" font-weight="bold" text-anchor="middle">
          ✨ NOVA DETECÇÃO
        </text>
      </g>

      <!-- Info Box -->
      <rect x="0" y="175" width="140" height="70" fill="#1e293b" rx="8" opacity="0.9"/>
      <text x="12" y="195" font-family="Arial" font-size="11" fill="#94a3b8">Confiança</text>
      <rect x="12" y="205" width="116" height="8" fill="#334155" rx="4"/>
      <rect x="12" y="205" width="93" height="8" fill="url(#bboxNew)" rx="4" class="confidence-bar"/>
      <text x="116" y="213" font-family="monospace" font-size="10" fill="#3b82f6" text-anchor="end">78%</text>

      <text x="12" y="232" font-family="Arial" font-size="11" fill="#94a3b8">Peso: <tspan fill="#f1f5f9" font-weight="bold">95 kg</tspan></text>
      <text x="12" y="247" font-family="Arial" font-size="11" fill="#94a3b8">ID: <tspan fill="#3b82f6" font-weight="bold">#2</tspan></text>

      <!-- Tracking ID -->
      <circle cx="130" cy="10" r="20" fill="#3b82f6"/>
      <text x="130" y="16" font-family="Arial" font-size="14" fill="white" font-weight="bold" text-anchor="middle">#2</text>
    </g>

    <!-- Detecção 3 - Animal com Alerta -->
    <g transform="translate(750, 200)">
      <!-- Bounding Box -->
      <rect x="0" y="0" width="200" height="250" fill="none" stroke="url(#bboxWarning)" stroke-width="3" class="bbox-detection" rx="8" filter="url(#strongGlow)"/>

      <!-- Silhueta Animal -->
      <ellipse cx="100" cy="125" rx="85" ry="55" fill="#4a4a4a" opacity="0.5"/>
      <circle cx="155" cy="100" r="28" fill="#4a4a4a" opacity="0.5"/>
      <!-- Chifres -->
      <path d="M 145 85 L 140 60 L 155 75 Z" fill="#d4a574" opacity="0.6"/>
      <path d="M 165 85 L 170 60 L 155 75 Z" fill="#d4a574" opacity="0.6"/>

      <!-- Label Alerta -->
      <g class="detection-label" transform="translate(0, -10)">
        <rect x="0" y="-35" width="200" height="30" fill="#f59e0b" rx="6"/>
        <text x="100" y="-15" font-family="Arial" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">
          ⚠️ COMPORTAMENTO ALTERADO
        </text>
      </g>

      <!-- Info Box -->
      <rect x="0" y="255" width="200" height="80" fill="#1e293b" rx="8" opacity="0.9"/>
      <text x="15" y="278" font-family="Arial" font-size="11" fill="#94a3b8">Confiança</text>
      <rect x="15" y="288" width="170" height="8" fill="#334155" rx="4"/>
      <rect x="15" y="288" width="145" height="8" fill="url(#bboxWarning)" rx="4" class="confidence-bar"/>
      <text x="173" y="296" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="end">89%</text>

      <text x="15" y="315" font-family="Arial" font-size="11" fill="#94a3b8">Peso: <tspan fill="#f1f5f9" font-weight="bold">220 kg</tspan></text>
      <text x="15" y="330" font-family="Arial" font-size="11" fill="#94a3b8">Status: <tspan fill="#f59e0b" font-weight="bold">Agitado</tspan></text>
      <text x="15" y="345" font-family="Arial" font-size="10" fill="#64748b">Alerta: Movimento intenso</text>

      <!-- Tracking ID -->
      <circle cx="190" cy="10" r="20" fill="#f59e0b"/>
      <text x="190" y="16" font-family="Arial" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="middle">#3</text>
    </g>

    <!-- Linha de Scanning -->
    <rect class="scan-line" x="0" y="0" width="1000" height="6" fill="url(#scanLineGradient)" filter="url(#strongGlow)"/>

    <!-- Coordenadas Overlay -->
    <g transform="translate(10, 630)">
      <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b">
        [0, 0]
      </text>
      <text x="970" y="0" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">
        [1000, 650]
      </text>
    </g>

    <!-- Target Reticle (centro) -->
    <g transform="translate(500, 325)" opacity="0.3">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4"/>
      <circle cx="0" cy="0" r="5" fill="#10b981"/>
      <line x1="-40" y1="0" x2="-20" y2="0" stroke="#10b981" stroke-width="1"/>
      <line x1="20" y1="0" x2="40" y2="0" stroke="#10b981" stroke-width="1"/>
      <line x1="0" y1="-40" x2="0" y2="-20" stroke="#10b981" stroke-width="1"/>
      <line x1="0" y1="20" x2="0" y2="40" stroke="#10b981" stroke-width="1"/>
    </g>
  </g>

  <!-- Painel Lateral - Tracking Data -->
  <g transform="translate(1070, 100)">
    <rect width="490" height="650" rx="12" fill="#1e293b"/>

    <!-- Título -->
    <rect width="490" height="50" rx="12" fill="#2d3740"/>
    <text x="25" y="32" font-family="Arial" font-size="16" font-weight="bold" fill="#f1f5f9">
      📋 Dados de Tracking
    </text>

    <!-- Tabela Header -->
    <g transform="translate(0, 60)">
      <rect width="490" height="35" fill="#2d3740"/>
      <text x="20" y="23" font-family="Arial" font-size="11" font-weight="bold" fill="#94a3b8">ID</text>
      <text x="70" y="23" font-family="Arial" font-size="11" font-weight="bold" fill="#94a3b8">BBox</text>
      <text x="200" y="23" font-family="Arial" font-size="11" font-weight="bold" fill="#94a3b8">Confiança</text>
      <text x="300" y="23" font-family="Arial" font-size="11" font-weight="bold" fill="#94a3b8">Peso</text>
      <text x="380" y="23" font-family="Arial" font-size="11" font-weight="bold" fill="#94a3b8">Status</text>
    </g>

    <!-- Tabela Rows -->
    <!-- Row 1 -->
    <g transform="translate(0, 95)" class="table-row">
      <rect width="490" height="50" fill="#1e293b"/>
      <text x="20" y="30" font-family="monospace" font-size="13" fill="#10b981" font-weight="bold">#001</text>
      <text x="70" y="30" font-family="monospace" font-size="10" fill="#64748b">[200,250,180,220]</text>
      <rect x="200" y="18" width="80" height="12" fill="#334155" rx="6"/>
      <rect x="200" y="18" width="74" height="12" fill="url(#bboxSuccess)" rx="6"/>
      <text x="288" y="28" font-family="monospace" font-size="10" fill="#10b981">92%</text>
      <text x="300" y="30" font-family="Arial" font-size="12" fill="#f1f5f9">185kg</text>
      <text x="380" y="30" font-family="Arial" font-size="11" fill="#10b981">🟢 Calmo</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 145)" class="table-row">
      <rect width="490" height="50" fill="#1e293b"/>
      <text x="20" y="30" font-family="monospace" font-size="13" fill="#3b82f6" font-weight="bold">#002</text>
      <text x="70" y="30" font-family="monospace" font-size="10" fill="#64748b">[500,300,140,170]</text>
      <rect x="200" y="18" width="80" height="12" fill="#334155" rx="6"/>
      <rect x="200" y="18" width="62" height="12" fill="url(#bboxNew)" rx="6"/>
      <text x="288" y="28" font-family="monospace" font-size="10" fill="#3b82f6">78%</text>
      <text x="300" y="30" font-family="Arial" font-size="12" fill="#f1f5f9">95kg</text>
      <text x="380" y="30" font-family="Arial" font-size="11" fill="#3b82f6">🔵 Novo</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 195)" class="table-row">
      <rect width="490" height="50" fill="#1e293b"/>
      <text x="20" y="30" font-family="monospace" font-size="13" fill="#f59e0b" font-weight="bold">#003</text>
      <text x="70" y="30" font-family="monospace" font-size="10" fill="#64748b">[750,200,200,250]</text>
      <rect x="200" y="18" width="80" height="12" fill="#334155" rx="6"/>
      <rect x="200" y="18" width="71" height="12" fill="url(#bboxWarning)" rx="6"/>
      <text x="288" y="28" font-family="monospace" font-size="10" fill="#f59e0b">89%</text>
      <text x="300" y="30" font-family="Arial" font-size="12" fill="#f1f5f9">220kg</text>
      <text x="380" y="30" font-family="Arial" font-size="11" fill="#f59e0b">⚠️ Agitado</text>
    </g>

    <!-- Resumo Estatísticas -->
    <g transform="translate(0, 260)">
      <rect width="490" height="130" rx="8" fill="#0f172a"/>
      <text x="20" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#f1f5f9">
        📊 Resumo em Tempo Real
      </text>

      <g transform="translate(20, 50)">
        <text x="0" y="0" font-family="Arial" font-size="12" fill="#94a3b8">Total Detectado:</text>
        <text x="150" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#10b981">3 animais</text>
      </g>
      <g transform="translate(20, 75)">
        <text x="0" y="0" font-family="Arial" font-size="12" fill="#94a3b8">Peso Médio:</text>
        <text x="150" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34d399">167 kg</text>
      </g>
      <g transform="translate(20, 100)">
        <text x="0" y="0" font-family="Arial" font-size="12" fill="#94a3b8">Confiança Média:</text>
        <text x="150" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#60a5fa">86.3%</text>
      </g>
    </g>

    <!-- Gráfico de Confiança -->
    <g transform="translate(20, 410)">
      <text x="0" y="0" font-family="Arial" font-size="14" fill="#94a3b8">Confiança por Detecção</text>
      <rect x="0" y="15" width="450" height="100" rx="8" fill="#0f172a"/>

      <!-- Barras -->
      <g transform="translate(40, 100)">
        <!-- Barra 1 -->
        <rect x="0" y="-74" width="60" height="74" fill="#10b981" rx="4"/>
        <text x="30" y="-80" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">92%</text>
        <text x="30" y="15" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">#001</text>

        <!-- Barra 2 -->
        <rect x="100" y="-62" width="60" height="62" fill="#3b82f6" rx="4"/>
        <text x="130" y="-68" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle">78%</text>
        <text x="130" y="15" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">#002</text>

        <!-- Barra 3 -->
        <rect x="200" y="-71" width="60" height="71" fill="#f59e0b" rx="4"/>
        <text x="230" y="-77" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle">89%</text>
        <text x="230" y="15" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">#003</text>

        <!-- Linha de threshold -->
        <line x1="0" y1="-40" x2="300" y2="-40" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="310" y="-36" font-family="Arial" font-size="9" fill="#64748b">threshold</text>
      </g>
    </g>

    <!-- Tracker Info -->
    <g transform="translate(20, 540)">
      <rect width="450" height="90" rx="8" fill="#0f172a"/>
      <text x="20" y="25" font-family="Arial" font-size="13" font-weight="bold" fill="#94a3b8">
        ℹ️ Informações do Tracker
      </text>
      <g transform="translate(20, 45)">
        <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b">Algorithm: DeepSort</text>
        <text x="150" y="0" font-family="monospace" font-size="10" fill="#64748b">Max Age: 30 frames</text>
        <text x="300" y="0" font-family="monospace" font-size="10" fill="#64748b">IoU Threshold: 0.3</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <rect width="1600" height="60" y="840" fill="#1e293b"/>
  <text x="800" y="875" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">
    AgroVision AI - Sistema de Detecção em Tempo Real v2.0
  </text>
</svg>